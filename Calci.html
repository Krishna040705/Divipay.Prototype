<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        /* General page styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Calculator container */
        #calcu {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        /* Heading */
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #444;
        }

        /* Result input field */
        #result {
            width: calc(100% - 20px);
            height: 60px;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #f1f1f1;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            color: #333;
        }

        /* Calculator buttons */
        input[type="button"] {
            width: 70px;
            height: 70px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: #f1f1f1;
            color: #333;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        /* Hover effect for buttons */
        input[type="button"]:hover {
            background: #ddd;
            transform: scale(1.05);
        }

        /* Active (click) effect for buttons */
        input[type="button"]:active {
            background: #ccc;
            transform: scale(0.95);
        }

        /* Operator buttons */
        input[type="button"][value="/"],
        input[type="button"][value="*"],
        input[type="button"][value="-"],
        input[type="button"][value="+"] {
            background: #ff9500;
            color: #fff;
        }

        /* Equals button */
        input[type="button"][value="="] {
            background: #34c759;
            color: #fff;
            width: 150px;
        }

        /* Clear button */
        input[type="button"][value="C"] {
            background: #ff3b30;
            color: #fff;
        }

        /* Zero button */
        input[type="button"][value="0"] {
            width: 150px;
        }
    </style>
</head>

<body>
    <div id="calcu">
        <h1>Expense Calculator</h1>
        <input type="text" id="result" disabled>
        <table>
            <tr>
                <td colspan="3"><input type="button" value="C" onclick="clearResult()"></td>
                <td><input type="button" value="/" onclick="appendToResult('/')"></td>
            </tr>
            <tr>
                <td><input type="button" value="7" onclick="appendToResult('7')"></td>
                <td><input type="button" value="8" onclick="appendToResult('8')"></td>
                <td><input type="button" value="9" onclick="appendToResult('9')"></td>
                <td><input type="button" value="*" onclick="appendToResult('*')"></td>
            </tr>
            <tr>
                <td><input type="button" value="4" onclick="appendToResult('4')"></td>
                <td><input type="button" value="5" onclick="appendToResult('5')"></td>
                <td><input type="button" value="6" onclick="appendToResult('6')"></td>
                <td><input type="button" value="-" onclick="appendToResult('-')"></td>
            </tr>
            <tr>
                <td><input type="button" value="1" onclick="appendToResult('1')"></td>
                <td><input type="button" value="2" onclick="appendToResult('2')"></td>
                <td><input type="button" value="3" onclick="appendToResult('3')"></td>
                <td><input type="button" value="+" onclick="appendToResult('+')"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="button" value="0" onclick="appendToResult('0')"></td>
                <td><input type="button" value="." onclick="appendToResult('.')"></td>
                <td><input type="button" value="=" onclick="calculateResult()"></td>
            </tr>
        </table>
    </div>

    <script>
        // Function to append value to the result input field
        function appendToResult(value) {
            document.getElementById('result').value += value;
        }

        // Function to clear the result input field
        function clearResult() {
            document.getElementById('result').value = '';
        }

        // Function to calculate the result
        function calculateResult() {
            let result = document.getElementById('result').value;
            try {
                // Evaluate the expression and update the result field
                document.getElementById('result').value = eval(result);
            } catch (error) {
                // Handle any errors (e.g., invalid expressions)
                document.getElementById('result').value = 'Error';
            }
        }
    </script>
	
</body>

</html>
